<!DOCTYPE html>

  <style>
  .install-alert-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .install-alert-overlay.show { display: flex; }
  .install-alert-modal {
    background: #1a1a24;
    border: 1px solid rgba(201,162,39,0.25);
    border-radius: 18px;
    padding: 40px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .install-alert-icon {
    width: 64px;
    height: 64px;
    background: rgba(201,162,39,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .install-alert-modal h2 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .install-alert-modal p {
    font-size: 13px;
    color: #777;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .install-alert-btn {
    display: block;
    padding: 13px;
    background: linear-gradient(135deg, #c9a227, #b8922a);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .install-alert-btn:hover { opacity: 0.88; }
  .install-alert-note {
    display: block;
    margin-top: 12px;
    font-size: 11px;
    color: #444;
  }
  </style>
</head>

  <script src="assets/js/main.js"></script>
  <script>
    var SIM_URLS = {
      pg: 'https://sh00.cc',
      jnd: 'https://sh00.cc',
      yc: 'https://sh00.cc'
    };

    var viewMap = { home: 'Home', cs: 'CS', find: 'Find', sim: 'Sim', lottery: 'Lottery' };

    function switchTab(tab) {
      var views = document.querySelectorAll('.tab-view');
      var navs = document.querySelectorAll('.bottom-nav-item');
      views.forEach(function(v) { v.classList.add('hidden'); });
      navs.forEach(function(n) { n.classList.remove('is-active'); });
      var key = viewMap[tab] || 'Home';
      var targetView = document.getElementById('view' + key);
      var targetNav = document.querySelector('.bottom-nav-item[data-tab="' + tab + '"]');
      if (targetView) targetView.classList.remove('hidden');
      if (targetNav) targetNav.classList.add('is-active');
      if (tab === 'find') {
        loadFeeds();
        loadBingCover();
      }
      if (tab === 'cs') {
        loadContacts();
      }
    }

    function handleHash() {
      var hash = location.hash.replace('#', '') || 'home';
      switchTab(hash);
    }

    window.addEventListener('hashchange', handleHash);
    window.addEventListener('DOMContentLoaded', handleHash);

    document.querySelectorAll('.bottom-nav-item').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var tab = this.getAttribute('data-tab');
        location.hash = tab;
      });
    });

    document.querySelectorAll('.sim-card').forEach(function(a) {
      var key = a.getAttribute('data-sim');
      var url = SIM_URLS[key];
      if (!url) {
        a.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          alert('请在后台管理员处配置此入口的跳转链接');
        });
      }
    });

    document.querySelectorAll('.cs-copy-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var item = this.closest('.cs-link-item');
        var val = item.getAttribute('data-copy');
        navigator.clipboard.writeText(val).then(function() {
          var orig = btn.textContent;
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(function() {
            btn.textContent = orig;
            btn.classList.remove('copied');
          }, 1500);
        });
      });
    });

    var contactsLoaded = false;
    function loadContacts() {
      if (contactsLoaded) return;
      contactsLoaded = true;
      var container = document.getElementById('csLinks');
      if (!container) return;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'api/contacts.php?t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (!data || data.length === 0) {
              container.innerHTML = '<p style="text-align:center;color:#999;padding:20px 0;">暂无联系方式</p>';
              return;
            }
            var html = '';
            data.forEach(function(item) {
              var bg = escapeHtml(item.icon_bg || '#999');
              var label = escapeHtml(item.label || item.type);
              html += '<div class="cs-link-item" data-copy="' + escapeHtml(item.value) + '">' +
                '<span class="cs-link-icon" style="background:' + bg + ';color:#fff">' + escapeHtml(label) + '</span>' +
                '<div class="cs-link-body">' +
                  '<span class="cs-link-name">' + escapeHtml(label) + '</span>' +
                  '<span class="cs-link-val">' + escapeHtml(item.value) + '</span>' +
                '</div>' +
                '<button type="button" class="cs-copy-btn">复制</button>' +
              '</div>';
            });
            container.innerHTML = html;
            container.querySelectorAll('.cs-copy-btn').forEach(function(btn) {
              btn.addEventListener('click', function() {
                var item = this.closest('.cs-link-item');
                var val = item.getAttribute('data-copy');
                navigator.clipboard.writeText(val).then(function() {
                  var orig = btn.textContent;
                  btn.textContent = '已复制';
                  btn.classList.add('copied');
                  setTimeout(function() {
                    btn.textContent = orig;
                    btn.classList.remove('copied');
                  }, 1500);
                });
              });
            });
          } catch(e) {
            container.innerHTML = '<p style="text-align:center;color:#999;padding:20px 0;">加载失败</p>';
          }
        }
      };
      xhr.onerror = function() {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:20px 0;">网络异常</p>';
      };
      xhr.send();
    }

    function loadBingCover() {
      var el = document.getElementById('findCover');
      if (!el) return;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'api/bing-cover.php?t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status !== 200) return;
        try {
          var d = JSON.parse(xhr.responseText);
          if (d.url) {
            el.style.backgroundImage = 'url(' + JSON.stringify(d.url) + ')';
          }
        } catch (e) {}
      };
      xhr.send();
    }

    var feedsLoaded = false;
    function loadFeeds() {
      if (feedsLoaded) return;
      feedsLoaded = true;
      var container = document.getElementById('feedsList');
      container.innerHTML = '<div class="feeds-loading">加载中...</div>';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'api/feeds.php?t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.error) {
              container.innerHTML = '<div class="feeds-empty">加载失败，请稍后重试</div>';
              return;
            }
            if (data.length === 0) {
              container.innerHTML = '<div class="feeds-empty">暂无动态</div>';
              return;
            }
            var html = '';
            data.forEach(function(item) {
              var imgsHtml = '';
              if (item.images && item.images.length > 0) {
                if (item.images.length === 1) {
                  imgsHtml += '<div class="feed-img-wrap feed-img-1"><img src="' + item.images[0] + '" alt="" class="feed-img" loading="lazy"></div>';
                } else if (item.images.length <= 3) {
                  imgsHtml += '<div class="feed-img-wrap feed-img-grid" style="grid-template-columns:repeat(' + item.images.length + ',1fr)">';
                  item.images.forEach(function(img) {
                    imgsHtml += '<img src="' + img + '" alt="" class="feed-img" loading="lazy">';
                  });
                  imgsHtml += '</div>';
                } else {
                  imgsHtml += '<div class="feed-img-wrap feed-img-grid" style="grid-template-columns:repeat(3,1fr)">';
                  item.images.forEach(function(img) {
                    imgsHtml += '<img src="' + img + '" alt="" class="feed-img" loading="lazy">';
                  });
                  imgsHtml += '</div>';
                }
              }
              var timeStr = item.created_at ? formatTime(item.created_at) : '';
              html += '<div class="feed-card">' +
                '<div class="feed-user">' +
                  '<div class="feed-avatar"><img src="assets/images/r1.jpg" alt=""></div>' +
                  '<div class="feed-meta">' +
                    '<div class="feed-name">官方动态</div>' +
                    '<div class="feed-time">' + timeStr + '</div>' +
                  '</div>' +
                '</div>' +
                (item.content ? '<div class="feed-content">' + escapeHtml(item.content) + '</div>' : '') +
                (imgsHtml ? '<div class="feed-images">' + imgsHtml + '</div>' : '') +
              '</div>';
            });
            container.innerHTML = html;
          } catch(e) {
            container.innerHTML = '<div class="feeds-empty">数据解析错误</div>';
          }
        } else {
          container.innerHTML = '<div class="feeds-empty">加载失败，请稍后重试</div>';
        }
      };
      xhr.onerror = function() {
        container.innerHTML = '<div class="feeds-empty">网络异常，请稍后重试</div>';
      };
      xhr.send();
    }

    function formatTime(dt) {
      var d = new Date(dt);
      var y = d.getFullYear();
      var mo = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      var h = String(d.getHours()).padStart(2, '0');
      var mi = String(d.getMinutes()).padStart(2, '0');
      return y + '-' + mo + '-' + day + ' ' + h + ':' + mi;
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    (function() {
      var cells = document.querySelectorAll('.lottery-cell[data-index]');
      var btn = document.getElementById('lotteryBtn');
      var overlay = document.getElementById('lotteryOverlay');

      var cellMap = {};
      cells.forEach(function(c) { cellMap[c.getAttribute('data-index')] = c; });

      var order = [0, 1, 2, 5, 8, 7, 6, 3];

      var prizes = [
        { index: 0, label: '8.88元',   isWin: true  },
        { index: 1, label: '18.88元',  isWin: true  },
        { index: 2, label: '28.88元',  isWin: true  },
        { index: 3, label: '谢谢惠顾',  isWin: false },
        { index: 5, label: '88.88元',  isWin: true  },
        { index: 6, label: '38.88元',  isWin: true  },
        { index: 7, label: '168.88元', isWin: true  },
        { index: 8, label: '888.88元', isWin: true  },
      ];

      var spinning = false;
      var curProb = 10;

      function fetchProb() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'api/lottery.php?action=prob&t=' + Date.now(), true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            try {
              var d = JSON.parse(xhr.responseText);
              if (d.prob !== undefined) curProb = parseFloat(d.prob) || 0;
            } catch(e) {}
          }
        };
        xhr.send();
      }
      fetchProb();

      function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
      }

      function doSpin() {
        if (spinning) return;
        spinning = true;

        Object.keys(cellMap).forEach(function(k) {
          cellMap[k].classList.remove('highlight', 'lucky');
        });

        var isWin = Math.random() * 100 < curProb;
        var winPool = prizes.filter(function(p) { return p.isWin; });
        var targetPrize = isWin
          ? winPool[Math.floor(Math.random() * winPool.length)]
          : prizes[3];

        var targetPos = order.indexOf(targetPrize.index);
        var totalSteps = 32 + targetPos;
        var startTime = null;

        var prevCellIdx = null;

        function tick(ts) {
          if (!startTime) startTime = ts;
          var rawT = Math.min((ts - startTime) / (totalSteps * 65), 1);
          var step = Math.floor(easeOutQuart(rawT) * totalSteps);
          var pos = step % 8;

          if (pos !== prevCellIdx) {
            if (prevCellIdx !== null) cellMap[order[prevCellIdx]].classList.remove('highlight');
            cellMap[order[pos]].classList.add('highlight');
            prevCellIdx = pos;
          }

          if (rawT < 1) {
            requestAnimationFrame(tick);
          } else {
            if (prevCellIdx !== null) cellMap[order[prevCellIdx]].classList.remove('highlight');
            cellMap[targetPrize.index].classList.add('highlight');
            if (isWin) cellMap[targetPrize.index].classList.add('lucky');
            setTimeout(function() { showModal(targetPrize, isWin); spinning = false; }, 350);
          }
        }

        requestAnimationFrame(tick);
      }

      function showModal(prize, isWin) {
        var modal = document.getElementById('lotteryModal');
        var iconEl = document.getElementById('lotteryModalIcon');
        var titleEl = document.getElementById('lotteryModalTitle');
        var msgEl = document.getElementById('lotteryModalMsg');

        modal.className = 'lottery-modal' + (isWin ? ' win-high' : ' no-win');
        iconEl.textContent = isWin ? '' : '';
        titleEl.textContent = isWin ? ('恭喜获得 ' + prize.label) : '谢谢参与';
        msgEl.textContent = isWin ? '祝您一路长红！' : '再接再厉，下次一定~';
        overlay.classList.add('show');
      }

      btn.addEventListener('click', doSpin);

      var closeBtn = document.getElementById('lotteryModalClose');
      if (closeBtn) closeBtn.addEventListener('click', function() { overlay.classList.remove('show'); });
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    })();

    // 安装检测
    (function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'api/check.php?t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status === 503) {
          try {
            var d = JSON.parse(xhr.responseText);
            if (d.status === 'not_installed' || d.status === 'db_error') {
              document.getElementById('installAlert').classList.add('show');
            }
          } catch(e) {}
        }
      };
      xhr.onerror = function() {
        // 网络错误时不弹窗，让页面正常显示
      };
      xhr.send();
    })();
  </script>
</body>
</html>
